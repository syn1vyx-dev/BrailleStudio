<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Braille Studio</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">
        ⠿ Braille Studio
    </div>

    <div class="top-actions">
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
        <button id="btn-import">Import</button>
    </div>
</header>


<div class="workspace">


<!-- LEFT SIDEBAR -->

<aside class="sidebar left">

<h3>Canvas</h3>

<label>
Characters Wide
<input id="cell-cols" type="number" min="1" value="2">
</label>

<label>
Characters Tall
<input id="cell-rows" type="number" min="1" value="1">
</label>


<hr>


<h3>Tools</h3>

<div class="tool-grid">

<button class="mode-btn active" data-mode="draw">
Draw
</button>

<button class="mode-btn" data-mode="erase">
Erase
</button>

<button class="mode-btn" data-mode="line">
Line
</button>

<button class="mode-btn" data-mode="rect">
Rectangle
</button>

</div>


<hr>


<button id="btn-fill">
Fill
</button>

<button id="btn-invert">
Invert
</button>

<button id="btn-clear">
Clear
</button>


<hr>


<h3>Effects</h3>

<button id="btn-onion">
Onion Skin
</button>


</aside>




<!-- MAIN EDITOR -->

<main class="editor">


<div class="editor-header">

<div id="grid-label">
8 × 4 pixels — 2 chars
</div>

</div>



<div id="dot-grid"></div>



<section class="timeline">


<div class="timeline-header">

<h3>
Timeline
</h3>

<div>

<button id="btn-prev-frame">
◀
</button>

<span id="frame-counter">
1 / 1
</span>

<button id="btn-next-frame">
▶
</button>

</div>

</div>


<div id="frame-strip"></div>


<div class="timeline-controls">

<button id="btn-new-frame">
+ Frame
</button>

<button id="btn-dup-frame">
Duplicate
</button>

<button id="btn-del-frame">
Delete
</button>


<button id="btn-play">
▶ Play
</button>


<label>
FPS

<input 
id="fps-slider"
type="range"
min="1"
max="30"
value="4">

<span id="fps-value">
4
</span>

</label>


<button id="btn-loop">
Loop
</button>

<button id="btn-bounce">
Bounce
</button>


</div>


</section>



</main>






<!-- RIGHT SIDEBAR -->

<aside class="sidebar right">


<h3>Output</h3>


<select id="anim-format">

<option value="js-braille">
JavaScript Braille
</option>

<option value="js-termdot">
TermDot
</option>

<option value="js-grid">
Grid JSON
</option>

<option value="json">
JSON
</option>

<option value="python">
Python
</option>

<option value="rust">
Rust
</option>

<option value="c">
C
</option>

</select>



<div class="output-box">

<h4>
Braille
</h4>

<button 
class="copy-btn"
data-target="out-braille">
Copy
</button>

<pre id="out-braille"></pre>

</div>



<div class="output-box">

<h4>
Unicode
</h4>

<button 
class="copy-btn"
data-target="out-unicode">
Copy
</button>

<pre id="out-unicode"></pre>

</div>



<div class="output-box">

<h4>
ASCII
</h4>

<button 
class="copy-btn"
data-target="out-ascii">
Copy
</button>

<pre id="out-ascii"></pre>

</div>



<div class="output-box">

<h4>
Animation
</h4>

<button 
class="copy-btn"
data-target="out-animation">
Copy
</button>

<pre id="out-animation"></pre>

</div>



</aside>


</div>






<!-- IMPORT MODAL -->


<div id="import-modal" class="modal-overlay">

<div class="modal">

<h2>
Import Braille
</h2>


<textarea 
id="import-textarea"
placeholder="Paste Braille, JSON, JS array...">
</textarea>


<div id="import-info"></div>

<div id="import-error"></div>


<div class="modal-buttons">

<button id="import-cancel">
Cancel
</button>

<button id="import-confirm" disabled>
Import
</button>

</div>


</div>

</div>





<!-- COMMAND PALETTE -->


<div id="command-palette" class="modal-overlay">

<div class="palette">

<input
id="palette-search"
placeholder="Search commands..."
>


<div id="palette-list"></div>


</div>

</div>





<!-- TOASTS -->

<div id="toast-container"></div>



<script src="script.js"></script>

</body>
</html>
