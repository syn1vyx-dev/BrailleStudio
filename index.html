<style>

* {
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body {
    margin:0;
    background:#08090b;
    color:#ddd;
}


header {
    height:64px;
    display:flex;
    align-items:center;
    padding:0 30px;
    border-bottom:1px solid #252525;
    font-size:20px;
    font-weight:700;
}


header span {
    color:#777;
    margin-left:12px;
    font-size:14px;
    font-weight:400;
}



.container {
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}



.card {
    background:#131416;
    border:1px solid #292929;
    border-radius:14px;
    padding:20px;
}



.title,
.collapse-title {
    color:#999;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:15px;
}



/* FILE DROP FIX */

.drop {
    display:block;
    border:2px dashed #444;
    padding:28px 20px;
    text-align:center;
    border-radius:12px;
    cursor:pointer;
    background:#101113;
    transition:.2s;
    line-height:1.5;
}


.drop:hover {
    border-color:#888;
}


input[type=file] {
    display:none;
}



#fileName {

    margin-top:18px;

    padding-left:4px;

    color:#777;

    font-size:14px;

}





textarea {

    width:100%;

    height:260px;

    background:#070707;

    color:#eee;

    border:1px solid #333;

    border-radius:10px;

    padding:15px;

    resize:vertical;

    font-family:monospace;

}




.buttons {

    display:flex;

    gap:10px;

    margin-top:15px;

}



button {

    background:#202124;

    border:1px solid #333;

    color:white;

    padding:10px 16px;

    border-radius:8px;

    cursor:pointer;

}



button:hover {

    background:#303136;

}




.status {

    color:#888;

    font-size:14px;

    margin-top:10px;

}




.preview {

    font-family:monospace;

    font-size:30px;

    line-height:1.2;

    background:#050505;

    border-radius:10px;

    padding:20px;

    min-height:120px;

    white-space:pre;

}




.output {

    position:relative;

    margin-bottom:35px;

}




/* COLLAPSIBLE HEADER FIX */

.collapse-title {

    cursor:pointer;

    user-select:none;

    padding-right:90px;

    margin-bottom:20px;

}



.collapse-title span {

    display:inline-block;

    width:18px;

}





/* COPY BUTTON FIX */

.copy {

    position:absolute;

    right:0;

    top:-18px;

    z-index:5;

}




pre {

    margin-top:10px;

    background:#070707;

    border:1px solid #333;

    border-radius:10px;

    padding:15px;

    overflow:auto;

    min-height:120px;

    white-space:pre-wrap;

    font-family:monospace;

}





@media(max-width:900px){

.container {

    grid-template-columns:1fr;

}

}


</style>
