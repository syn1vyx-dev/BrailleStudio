<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Braille Studio Converter</title>

<style>
* {
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body {
    margin:0;
    background:#08090b;
    color:#ddd;
}

header {
    height:64px;
    display:flex;
    align-items:center;
    padding:0 30px;
    border-bottom:1px solid #252525;
    font-size:20px;
    font-weight:700;
}

header span {
    color:#777;
    margin-left:12px;
    font-size:14px;
    font-weight:400;
}


.container {
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}


.card {
    background:#131416;
    border:1px solid #292929;
    border-radius:14px;
    padding:20px;
}


.title {
    color:#999;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:15px;
}


textarea {
    width:100%;
    height:260px;
    background:#070707;
    color:#eee;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
    resize:vertical;
    font-family:monospace;
}


.drop {
    border:2px dashed #444;
    padding:25px;
    text-align:center;
    border-radius:12px;
    cursor:pointer;
    background:#101113;
}

.drop:hover {
    border-color:#888;
}


input[type=file] {
    display:none;
}


.buttons {
    display:flex;
    gap:10px;
    margin-top:15px;
}


button {
    background:#202124;
    border:1px solid #333;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover {
    background:#303136;
}


pre {
    background:#070707;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
    overflow:auto;
    min-height:120px;
    white-space:pre-wrap;
}


.output {
    position:relative;
    margin-bottom:25px;
}


.copy {
    position:absolute;
    right:0;
    top:-5px;
}


.preview {

    font-family:monospace;
    font-size:30px;
    line-height:1.2;
    background:#050505;
    border-radius:10px;
    padding:20px;
    min-height:120px;
}


.status {

    margin-top:10px;
    color:#888;
    font-size:14px;

}


@media(max-width:900px){

.container {
    grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>
✦ Braille Studio
<span>DAB → Braille → Java</span>
</header>



<div class="container">



<div class="card">


<div class="title">
Input
</div>


<label class="drop">

📂 Drop JSON / Choose File

<input id="fileInput" type="file" accept=".json,.dab">

</label>


<div id="fileName" class="status">
No file loaded
</div>


<br>


<textarea id="input"
placeholder="Paste DAB JSON here..."></textarea>


<div class="buttons">

<button onclick="convert()">
Convert
</button>


<button onclick="clearAll()">
Clear
</button>

</div>


<div id="status" class="status"></div>


</div>





<div class="card">


<div class="title">
Preview
</div>


<div id="preview" class="preview">
No animation
</div>


<div class="buttons">

<button onclick="previousFrame()">
◀
</button>

<button onclick="play()">
▶ Play
</button>

<button onclick="stop()">
■
</button>

<button onclick="nextFrame()">
▶
</button>

</div>


<div id="frameInfo" class="status"></div>


</div>





<div class="card">


<div class="output">

<div class="title">
Clean JSON
</div>

<button class="copy"
onclick="copyText('jsonOut')">
Copy
</button>

<pre id="jsonOut"></pre>

</div>


<div class="output">

<div class="title">
Java Class
</div>

<button class="copy"
onclick="copyText('javaOut')">
Copy
</button>

<pre id="javaOut"></pre>

</div>


<div class="output">

<div class="title">
String Array
</div>

<button class="copy"
onclick="copyText('stringOut')">
Copy
</button>

<pre id="stringOut"></pre>

</div>


</div>


</div>





<script>


const DOT_BITS=[
[0x01,0x08],
[0x02,0x10],
[0x04,0x20],
[0x40,0x80]
];


let frames=[];
let currentFrame=0;
let timer=null;



function gridToBraille(grid){

let mask=0;


for(let r=0;r<4;r++){

for(let c=0;c<2;c++){

if(grid[r][c])
mask |= DOT_BITS[r][c];

}

}


return String.fromCodePoint(0x2800+mask);

}




function convert(){


let data;


try{

data=JSON.parse(
document.getElementById("input").value
);

}

catch{

status.textContent="Invalid JSON";

return;

}



if(!Array.isArray(data.frames)){

status.textContent="Missing frames array";

return;

}



frames=data.frames.map(frame=>{


let rows=data.cellRows||1;
let cols=data.cellCols||1;


let chars=[];


for(let y=0;y<rows;y++){

let line="";


for(let x=0;x<cols;x++){


let cell=[];


for(let r=0;r<4;r++){

cell.push(
(frame[y*4+r]||[])
.slice(x*2,x*2+2)
);

}


line+=gridToBraille(cell);


}


chars.push(line);

}


return chars.join("\n");


});



let clean={

fps:data.fps||0,
loop:data.loop||false,
bounce:data.bounce||false,
frames

};



jsonOut.textContent=
JSON.stringify(clean,null,2);



javaOut.textContent=
`public class Animation {

public static final int FPS=${data.fps||0};

public static final String[] FRAMES={

${frames.map(f=>"\""+f.replaceAll('"','\\"')+"\"").join(",\n")}

};

}`;



stringOut.textContent=
`String[] frames={

${frames.map(f=>JSON.stringify(f)).join(",\n")}

};`;



currentFrame=0;

showFrame();


status.textContent=
`Converted ${frames.length} frames`;

}





function showFrame(){

if(!frames.length)return;


preview.textContent=
frames[currentFrame];


frameInfo.textContent=
`Frame ${currentFrame+1}/${frames.length}`;

}





function nextFrame(){

if(!frames.length)return;

currentFrame++;

if(currentFrame>=frames.length)
currentFrame=0;

showFrame();

}



function previousFrame(){

currentFrame--;

if(currentFrame<0)
currentFrame=frames.length-1;

showFrame();

}



function play(){

stop();

timer=setInterval(nextFrame,
1000/10);

}



function stop(){

clearInterval(timer);

}



function clearAll(){

input.value="";
jsonOut.textContent="";
javaOut.textContent="";
stringOut.textContent="";
preview.textContent="No animation";
frames=[];

}



fileInput.onchange=e=>{

let file=e.target.files[0];

if(!file)return;


fileName.textContent=file.name;


let reader=new FileReader();


reader.onload=e=>{

input.value=e.target.result;

convert();

};


reader.readAsText(file);

};





function copyText(id){

navigator.clipboard.writeText(
document.getElementById(id).textContent
);


status.textContent="Copied";

}


</script>


</body>
</html>
