<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Braille Studio</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

    <div class="logo">
        ⠃⠗⠁⠊⠇⠇⠑ Studio
    </div>


    <div class="toolbar">


        <button id="undoBtn">
            ↶ Undo
        </button>


        <button id="redoBtn">
            ↷ Redo
        </button>


        <button id="clearBtn">
            Clear
        </button>


        <button id="playBtn">
            ▶ Play
        </button>


        <label>
            FPS

            <input
                id="fpsInput"
                type="number"
                value="12"
                min="1"
                max="60"
            >

        </label>


    </div>


</header>





<div class="layout">



    <!-- LEFT PANEL -->

    <aside class="sidebar">


        <h2>
            Tools
        </h2>


        <button class="tool active">
            ✏ Pencil
        </button>


        <button class="tool">
            🧽 Eraser
        </button>



        <hr>



        <h2>
            Canvas
        </h2>



        <label>
            Width

            <input
                id="widthInput"
                type="number"
                value="16"
                min="1"
                max="50"
            >

        </label>



        <label>
            Height

            <input
                id="heightInput"
                type="number"
                value="4"
                min="1"
                max="20"
            >

        </label>



        <button id="resizeBtn">
            Resize Canvas
        </button>



        <hr>



        <h2>
            Files
        </h2>


        <button id="copyBtn">
            Copy Braille
        </button>


        <button id="saveBtn">
            Save Project
        </button>


        <button id="loadBtn">
            Load Project
        </button>


        <input
            id="fileInput"
            type="file"
            accept=".json"
            hidden
        >


    </aside>






    <!-- CENTER -->

    <main class="workspace">



        <section class="canvas-area">


            <h2>
                Editor
            </h2>


            <div
                id="canvas"
                class="braille-canvas">
            </div>


        </section>





        <section class="timeline-area">


            <div class="timeline-title">

                <h2>
                    Timeline
                </h2>


                <button id="addFrameBtn">
                    + Frame
                </button>


            </div>



            <div
                id="timeline"
                class="timeline">
            </div>


        </section>


    </main>






    <!-- RIGHT PANEL -->

    <aside class="preview-panel">


        <h2>
            Preview
        </h2>


        <div
            id="preview"
            class="preview">
        </div>



        <h3>
            Current Frame
        </h3>


        <div id="frameLabel">
            1
        </div>




        <h2>
            Project Info
        </h2>


        <div class="info">


            <p>
                Characters:
                <span id="characterCount">
                    64
                </span>
            </p>


            <p>
                Braille:
            </p>


            <pre id="output"></pre>


        </div>


    </aside>



</div>





<script src="script.js"></script>


</body>

</html>
