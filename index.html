<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Braille Converter</title>

<style>
* {
    box-sizing: border-box;
    font-family: Inter, system-ui, sans-serif;
}

body {
    margin: 0;
    background: #0b0b0c;
    color: #ddd;
}

header {
    height: 60px;
    border-bottom: 1px solid #252525;
    display: flex;
    align-items: center;
    padding: 0 25px;
    font-weight: 700;
    font-size: 18px;
}

header span {
    color: #888;
    margin-left: 10px;
    font-weight: 400;
}

.container {
    padding: 25px;
    display: grid;
    gap: 20px;
}

.card {
    background: #151516;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.title {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

textarea {
    width: 100%;
    min-height: 230px;
    resize: vertical;
    background: #090909;
    color: #eee;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    font-family: monospace;
}

button {
    background: #202020;
    color: white;
    border: 1px solid #333;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #2c2c2c;
}

.outputs {
    display: grid;
    gap: 15px;
}

.output {
    position: relative;
}

pre {
    background: #090909;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    overflow-x: auto;
    min-height: 80px;
    color: #ddd;
}

.copy {
    position: absolute;
    right: 15px;
    top: 35px;
}
</style>
</head>

<body>

<header>
    ✦ Braille Converter
    <span>DAB → JSON / Java</span>
</header>


<div class="container">

<div class="card">
<div class="title">DAB JSON Input</div>

<textarea id="input" placeholder="Paste DAB JSON here..."></textarea>

<br><br>

<button onclick="convert()">Convert</button>

</div>


<div class="card outputs">

<div class="output">
<div class="title">Clean JSON</div>
<button class="copy" onclick="copyText('jsonOut')">Copy</button>
<pre id="jsonOut"></pre>
</div>


<div class="output">
<div class="title">Java Public Class</div>
<button class="copy" onclick="copyText('javaOut')">Copy</button>
<pre id="javaOut"></pre>
</div>


<div class="output">
<div class="title">Java String Array</div>
<button class="copy" onclick="copyText('stringOut')">Copy</button>
<pre id="stringOut"></pre>
</div>


</div>

</div>


<script>

const DOT_BITS = [
    [0x01, 0x08],
    [0x02, 0x10],
    [0x04, 0x20],
    [0x40, 0x80]
];


function gridToBraille(grid) {

    let mask = 0;

    for(let r=0;r<4;r++){
        for(let c=0;c<2;c++){

            if(grid[r][c]){
                mask |= DOT_BITS[r][c];
            }

        }
    }

    return String.fromCodePoint(0x2800 + mask);
}



function convert(){

    let data;

    try{
        data = JSON.parse(
            document.getElementById("input").value
        );
    }
    catch(e){
        alert("Invalid JSON");
        return;
    }


    let frames = data.frames.map(frame => {

        let chars=[];

        let rows = data.cellRows || 1;
        let cols = data.cellCols || 1;


        for(let y=0;y<rows;y++){

            let line="";

            for(let x=0;x<cols;x++){

                let cell=[];

                for(let r=0;r<4;r++){

                    cell.push(
                        frame[y*4+r].slice(
                            x*2,
                            x*2+2
                        )
                    );

                }

                line += gridToBraille(cell);

            }

            chars.push(line);

        }


        return chars.join("\n");

    });



    let clean = {

        fps:data.fps || 0,

        loop:data.loop || false,

        bounce:data.bounce || false,

        frames:frames

    };


    document.getElementById("jsonOut").textContent =
        JSON.stringify(clean,null,2);



    document.getElementById("javaOut").textContent =
`public class Animation {

    public static final int FPS = ${data.fps || 0};

    public static final String[] FRAMES = {
${frames.map(f => `        "${f}"`).join(",\n")}
    };

}`;



    document.getElementById("stringOut").textContent =
`String[] frames = {
${frames.map(f => `    "${f}"`).join(",\n")}
};`;

}



function copyText(id){

    navigator.clipboard.writeText(
        document.getElementById(id).textContent
    );

}

</script>

</body>
</html>
