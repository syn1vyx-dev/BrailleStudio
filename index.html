<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Braille Studio</title>

<link rel="stylesheet" href="style.css">
</head>


<body>


<header class="topbar">

    <div class="logo">
        ⠃⠗⠁⠊⠇⠇⠑ Studio
    </div>


    <div class="toolbar">

        <button id="undoBtn">↶</button>
        <button id="redoBtn">↷</button>

        <button id="clearBtn">
            Clear
        </button>

        <button id="playBtn">
            ▶ Play
        </button>


        <label>
            FPS
            <input id="fpsInput" type="number" value="12">
        </label>

    </div>

</header>





<div class="layout">


<!-- LEFT -->

<aside class="sidebar">


<h2>Tools</h2>


<button id="pencilBtn" class="tool active">
✏ Pencil
</button>


<button id="eraserBtn" class="tool">
🧽 Eraser
</button>



<hr>



<h2>Canvas</h2>


<label>
Width

<input
id="widthInput"
type="number"
value="16"
min="1"
max="50">

</label>



<label>
Height

<input
id="heightInput"
type="number"
value="4"
min="1"
max="20">

</label>



<button id="resizeBtn">
Resize
</button>



<hr>



<h2>Files</h2>


<button id="copyBtn">
Copy Braille
</button>


<button id="saveBtn">
Save Project
</button>


<button id="loadBtn">
Load Project
</button>


<input
id="fileInput"
type="file"
accept=".json"
hidden>


</aside>








<!-- CENTER -->

<main class="workspace">


<section class="canvas-area">


<h2>
Editor
</h2>


<div
id="canvas"
class="braille-canvas">
</div>


</section>






<section class="timeline-area">


<div class="timeline-header">

<h2>
Timeline
</h2>


<div>

<button id="addFrameBtn">
+ Frame
</button>

<button id="duplicateBtn">
Duplicate
</button>


<button id="deleteFrameBtn">
Delete
</button>


</div>


</div>



<div
id="timeline"
class="timeline">
</div>


</section>



</main>









<!-- RIGHT -->

<aside class="preview-panel">


<h2>
Preview
</h2>


<div
id="preview"
class="preview">
</div>



<h3>
Frame
</h3>


<span id="frameLabel">
1
</span>



<h3>
Output
</h3>


<pre id="output"></pre>


</aside>



</div>





<script src="script.js"></script>


</body>

</html>
